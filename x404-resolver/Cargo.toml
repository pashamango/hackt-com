[package]
name = "x404-resolver"
version = "0.1.0"
edition = "2021"
description = "Edge-first generative 404 protocol (x404) & patience protocol (x420) resolver"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
